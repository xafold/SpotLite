[package]
name = "spotlite"
version = "0.1.0"
edition = "2024"

[dependencies]
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "pnm", "tga"] }
kamadak-exif = "0.6.1"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
ureq = "2"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1.8.0"
