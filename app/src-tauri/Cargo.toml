[package]
name = "spotlite-app"
version = "0.1.0"
description = "SpotLite for Windows and Linux: the tray icon, the hotkey and the search panel, over SpotLite's helper"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
notify = "8.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The panel's size on Linux (`panel_height`): the GTK that Tauri itself is built on.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# `search:`'s browser (browser.rs): the WebKitGTK that Tauri itself is built on.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
