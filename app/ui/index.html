<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SpotLite</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="panel" class="panel">
    <header class="field">
      <svg class="pick" viewBox="0 0 24 24" aria-hidden="true">
        <path class="handle" d="M14.6 14.6 L20.4 20.4"/>
        <circle class="head" cx="10" cy="10" r="6"/>
      </svg>
      <input id="query" type="text" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search"
             placeholder="Describe it: “payment error screenshot”, “zebra in a video”…">
      <button id="dig" class="dig" type="button" tabindex="-1" data-state="idle"
              title="Look for files that are new or changed since the last index, and index only those">
        <span class="dig-mark" aria-hidden="true"></span><span id="dig-label">New files</span>
      </button>
      <div id="progress" class="progress" hidden><span></span></div>
    </header>
    <section id="body" class="body" hidden>
      <div id="list" class="list" role="listbox" aria-label="Results"></div>
      <div id="preview" class="preview" aria-live="polite"></div>
    </section>
    <footer id="footer" class="footer" hidden>
      <span id="summary" class="summary"></span>
      <span id="keys" class="keys"></span>
    </footer>
  </main>
  <script src="panel.js"></script>
</body>
</html>
